name: Validate SQL scripts

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  validate:
    runs-on: ubuntu-latest

    services:
      sqlserver:
        image: mcr.microsoft.com/mssql/server:2022-latest
        env:
          ACCEPT_EULA: "Y"
          SA_PASSWORD: "P@ssw0rd_CI_Only!"
        ports:
          - 1433:1433
        options: >-
          --health-cmd "/opt/mssql-tools18/bin/sqlcmd -S localhost -U sa -P P@ssw0rd_CI_Only! -C -Q 'SELECT 1' || exit 1"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 10

    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install Faker
        run: pip install faker

      - name: Regenerate seed data
        run: |
          cd sql/02_data
          python generate_data.py > 03_seed_data.sql

      - name: Install sqlcmd
        run: |
          curl -sSL -O https://packages.microsoft.com/config/ubuntu/22.04/packages-microsoft-prod.deb
          sudo dpkg -i packages-microsoft-prod.deb
          sudo apt-get update
          sudo ACCEPT_EULA=Y apt-get install -y mssql-tools18 unixodbc-dev

      - name: Run schema + seed data + all topic modules
        run: |
          export PATH="$PATH:/opt/mssql-tools18/bin"
          for f in \
            sql/01_schema/01_create_database.sql \
            sql/01_schema/02_create_tables.sql \
            sql/02_data/03_seed_data.sql \
            sql/03_transactions/transaction_control.sql \
            sql/04_performance/indexing_and_tuning.sql \
            sql/05_fragmentation/horizontal_fragmentation.sql \
            sql/06_replication/replication_consistency.sql \
            sql/07_distributed_transactions/move_parcel_between_sites.sql \
            sql/08_bi_olap/star_schema_and_analysis.sql ; do
              echo "Running $f"
              sqlcmd -S localhost -U sa -P "P@ssw0rd_CI_Only!" -C -i "$f"
          done
